<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>f-core Renderer</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #000000;
      }
      #fc-stage {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
      }
      #fc-bg-layer,
      #fc-fg-layer,
      #fc-text-layer {
        position: absolute;
        inset: 0;
      }
      #fc-bg-layer {
        z-index: 0;
      }
      #fc-fg-layer {
        z-index: 1;
        pointer-events: none;
      }
      @keyframes fc-shake {
        0% {
          transform: translate3d(calc(var(--fc-shake-intensity, 0) * -1px), 0, 0);
        }
        25% {
          transform: translate3d(calc(var(--fc-shake-intensity, 0) * 1px), 0, 0);
        }
        50% {
          transform: translate3d(calc(var(--fc-shake-intensity, 0) * -1px), 0, 0);
        }
        75% {
          transform: translate3d(calc(var(--fc-shake-intensity, 0) * 1px), 0, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }
      #fc-text-layer {
        --fc-shake-intensity: 0;
        --fc-shake-play-state: paused;
        --fc-text-color: #111111;
        z-index: 2;
        padding: 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--fc-text-color, white);
        pointer-events: auto;
        animation-name: fc-shake;
        animation-duration: 120ms;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        animation-play-state: var(--fc-shake-play-state, paused);
      }
      #fc-bg-layer img,
      #fc-fg-layer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="fc-stage">
      <div id="fc-bg-layer"></div>
      <div id="fc-fg-layer"></div>
      <div id="fc-text-layer"></div>
    </div>
    <script type="module" src="/renderer_app.js"></script>
  </body>
</html>
